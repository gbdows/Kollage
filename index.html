<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Kollage</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{font:12px "Segoe UI",system-ui,sans-serif;background:#fff;color:#222;display:flex;flex-direction:column;overflow:hidden;user-select:none}
#top{display:flex;border-bottom:1px solid #ddd;height:58px;flex:none}
#lt{flex:none}
#mb{display:flex;align-items:center;height:28px}
.app{font-weight:600;margin:0 8px 0 6px;color:#1a6fb5}
.menu{position:relative;padding:6px 9px;cursor:default}.menu:hover,.menu.open{background:#cde6f7}
.dd{display:none;position:absolute;background:#fff;border:1px solid #bbb;box-shadow:2px 3px 8px #0003;z-index:60;min-width:210px;padding:2px 0;white-space:nowrap}
.menu.open>.dd{display:block;top:100%;left:0}
.it{position:relative;display:flex;justify-content:space-between;gap:24px;padding:5px 18px 5px 14px;color:#222}
.it:hover{background:#cde6f7}.it i{color:#888;font-style:normal}
.it.has:after{content:"▸";position:absolute;right:6px}
.it:hover>.dd{display:block;left:100%;top:-3px}
.dd hr{border:0;border-top:1px solid #ddd;margin:3px 0}
#ic{display:flex;gap:1px;padding:2px 6px;align-items:center;height:28px}
#ic button,#tog button{border:1px solid transparent;background:none;cursor:pointer;font-size:15px;padding:2px 5px;height:26px}
#ic button:hover,#tog button:hover{background:#dbeaf7;border-color:#9cc}
#ic button.on{background:#cfe3f5;border-color:#6aa}#ic .s{width:1px;height:18px;background:#ddd;margin:0 4px}
#tabs{flex:1;display:flex;gap:4px;padding:4px 10px;overflow-x:auto;align-items:center}
.tab{position:relative;border:1px solid #bbb;padding:2px;background:#fff;flex:none;cursor:pointer}.tab.on{background:#b4d6f1;border-color:#5a9bd0}
.tab canvas{display:block;background:#fff}
.tab b{display:none;position:absolute;right:0;top:0;background:#c0505a;color:#fff;width:14px;text-align:center;line-height:14px;font-size:11px}.tab:hover b{display:block}
#tog{display:flex;align-items:flex-start;padding:4px}
#tb{display:flex;align-items:center;gap:14px;padding:0 8px;height:30px;border-bottom:1px solid #ddd;flex:none;white-space:nowrap;overflow-x:auto}
#tb input[type=number]{width:52px;border:1px solid #999;padding:2px}#tb select{border:1px solid #999;padding:2px}
#tb input[type=range]{width:100px;vertical-align:middle}
#main{flex:1;position:relative;min-height:0;background:#ababab}
#scroll{position:absolute;inset:0;overflow:auto;display:flex}
#doc{margin:auto;position:relative;box-shadow:0 0 6px #0005;flex:none;line-height:0}
#cv{image-rendering:pixelated;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px;cursor:crosshair}
#ov{position:absolute;left:0;top:0;pointer-events:none}.panel{box-sizing:border-box;overflow:hidden}.hb{flex-wrap:wrap}.hb button{padding:2px 4px}#cols .r{flex-wrap:wrap}#cols .r select{width:64px}.tbn svg,#ic svg,#tog svg{display:block;margin:auto}
canvas{display:block}
#st button svg,.hb button svg,#swap svg{width:16px;height:16px;display:block}.hb button svg{width:18px;height:18px}.tbn svg,#ic svg,#tog svg{width:20px;height:20px}
#txt{position:absolute;display:none;border:0;outline:1px dashed #0078d7;background:#ffffff40;padding:0;margin:0;z-index:4;line-height:1.2;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word;box-sizing:border-box}
.panel{position:absolute;background:#f7f7f7ee;border:1px solid #d5d5d5;box-shadow:0 2px 8px #0003;z-index:5;line-height:normal}
.panel h4{margin:0;padding:5px 6px 5px 8px;font-weight:400;color:#666;background:#eee;display:flex;justify-content:space-between;cursor:move}
.x{background:#c0505a;color:#fff;width:18px;text-align:center;cursor:pointer}
#tools{left:4px;top:4px;width:62px}#tg{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px}
.tbn{height:26px;border:1px solid transparent;background:none;font-size:15px;cursor:pointer;padding:0}.tbn:hover{background:#dbeaf7;border-color:#9cc}.tbn.on{background:#b4d6f1;border-color:#5a9bd0}
#hist{right:4px;top:4px;width:180px;height:190px;display:flex;flex-direction:column}
#hl{flex:1;overflow:auto;padding:2px}#hl div{padding:3px 6px;border:1px solid transparent;cursor:default}#hl .on{background:#b4d6f1;border-color:#7fb2dc}#hl .fut{color:#999}
.hb{padding:3px 6px;display:flex;gap:4px;border-top:1px solid #ddd}.hb button{border:0;background:none;font-size:16px;cursor:pointer;color:#555}
#lay{right:4px;bottom:4px;width:180px;height:200px;display:flex;flex-direction:column}
#ll{flex:1;overflow:auto}
.l{display:flex;align-items:center;gap:6px;padding:3px 4px;border:1px solid transparent;margin:2px}.l.on{background:#b4d6f1;border-color:#7fb2dc}.l span{flex:1;overflow:hidden;text-overflow:ellipsis}
.l canvas{width:40px;height:30px;border:1px solid #999;background:#fff}
#cols{left:4px;bottom:4px;width:180px}
#cols .r{display:flex;gap:6px;padding:6px;align-items:center}
#sw{position:relative;width:48px;height:46px;flex:none}
#c1,#c2{position:absolute;width:26px;height:26px;border:2px solid #fff;outline:1px solid #666;cursor:pointer}#c1{left:2px;top:2px;background:#000;z-index:2}#c2{left:18px;top:16px;background:#fff}
#wheel{display:block;margin:0 auto;border-radius:50%;cursor:crosshair}
#pal{display:grid;grid-template-columns:repeat(14,1fr);padding:6px}#pal b{height:12px;cursor:pointer}
#more{display:none;padding:0 6px 6px}#more input{width:80px}#arow{padding:0 6px 6px}#arow #al{width:70px}#arow #an{width:46px}#dlgb label>select{grid-column:2/4}
#st{height:24px;display:flex;align-items:center;gap:16px;padding:0 8px;border-top:1px solid #ccc;background:#f3f3f3;flex:none;white-space:nowrap;overflow:hidden}
#st .g{flex:1;overflow:hidden;text-overflow:ellipsis}#st input{width:110px}
#st button{border:0;background:none;cursor:pointer;font-size:14px}
#dlg{position:fixed;right:210px;top:140px;display:none;z-index:99;line-height:normal}
#dlgb{background:#f0f0f0;border:1px solid #777;box-shadow:0 4px 16px #0006;padding:12px;min-width:320px;display:flex;flex-direction:column;gap:8px}
#dlgb>b{cursor:move;user-select:none;display:block;padding:2px 0}#dlgb{cursor:move}#dlgb label,#dlgb input,#dlgb select,#dlgb button{cursor:auto}#dlgb button{cursor:pointer}#dlgb label{display:grid;grid-template-columns:110px 1fr 60px;gap:8px;align-items:center}
#dlgb label>input:only-of-type{grid-column:2/4}
.bt{display:flex;gap:8px;justify-content:flex-end}.bt button{min-width:76px;padding:4px;border:1px solid #888;background:#e6e6e6}.bt button:first-child{border-color:#0078d7}
</style></head><body>
<div id="top"><div id="lt"><div id="mb"><span class="app">◆ Kollage</span></div><div id="ic"></div></div><div id="tabs"></div><div id="tog"></div></div>
<div id="tb">

</div>
<div id="main"><div id="scroll"><div id="doc"><canvas id="cv"></canvas><canvas id="ov"></canvas><textarea id="txt" spellcheck="false"></textarea></div></div>
<div class="panel" id="tools"><h4>Outils</h4><div id="tg"></div></div>
<div class="panel" id="hist"><h4>Historique</h4><div id="hl"></div><div class="hb"><button id="un">↶</button><button id="re">↷</button></div></div>

</div>
<div id="st"><span class="g" id="hint"></span><span id="sz"></span><span id="pos">0, 0</span><span>px</span><button id="zo">−</button><input id="zs" type="range" min="5" max="10000" value="100"><button id="zi">+</button><span id="zl" style="width:40px"></span><button id="zf" title="Ajuster">⤢</button></div>
<div id="dlg"><div id="dlgb"></div></div>
<input type="file" id="xf" accept=".js" multiple hidden><input type="file" id="file" accept="image/*,.kol,.pdn" multiple hidden>
